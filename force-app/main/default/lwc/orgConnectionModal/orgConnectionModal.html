<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" 
                aria-labelledby="modal-heading" 
                aria-modal="true"
                class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                
                <!-- Кастомная обертка для стилей -->
                <div class="overlay">
                    <div class="modal">
                        
                        <!-- Шапка модального окна -->
                        <div class="modal-header">
                            <span>New org connection</span>
                            <span class="close" onclick={handleClose} title="Close">✕</span>
                        </div>

                        <!-- Тело модального окна -->
                        <div class="modal-body">
                            <lightning-input 
                                type="text" 
                                label="Org name" 
                                data-id="orgName"
                                placeholder="e.g. Meridian Bank Scratch" 
                                value={orgName} 
                                onchange={handleInputChange}
                                required
                                class="field">
                            </lightning-input>

                            <lightning-combobox
                                label="Type"
                                data-id="type"
                                value={type}
                                options={typeOptions}
                                onchange={handleInputChange}
                                class="field">
                            </lightning-combobox>

                            <lightning-input 
                                type="text" 
                                label="Login URL" 
                                data-id="loginUrl"
                                placeholder="e.g. https://test.salesforce.com" 
                                value={loginUrl} 
                                onchange={handleInputChange}
                                class="field">
                            </lightning-input>
                            
                            <p class="hint">At least one of Type or Login URL must be filled</p>
                            
                            <!-- Кнопки действий -->
                            <div class="actions">
                                <button class="btn" onclick={handleClose}>Cancel</button>
                                <button class="btn btn-primary" onclick={handleSave}>Save & authorize</button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </section>
        
        <!-- Затемнение фона (Backdrop) -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
